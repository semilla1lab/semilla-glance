<title>Semilla Glance</title>

 <div class="card">Pair code from your backend: <input id="pair" maxlength="6"> <button id="save">Pair</button></div>
 <div class="card">Glasses screen: <b id="screen">boot</b><br><small>Tap = open / choose · Double tap = back · Menu = Digest</small></div>
